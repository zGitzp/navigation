var questions = [
  {

  },
  {
    q: "2.备用发电机组带载试验的每月最低时长是？（）",
    opts: ["A.15min", "B.30min", "C.60min", "D.120min"]
  },
  {
    q: "3.跑道末端灯至少应由（）个灯组成。",
    opts: ["A.6", "B.8", "C.10", "D.12"]
  },
  {
    q: "4.跑道中线灯的颜色排列应遵循什么原则？（）",
    opts: ["A.全白", "B.全红", "C.白红交替", "D.白绿交替"]
  },
  {
    q: "5.助航灯光系统日常巡检的频率通常为（）。",
    opts: ["A.每日一次", "B.每周一次", "C.每月一次", "D.每季度一次"]
  },
  {
    q: "6.精密进近灯光系统（CAT I）的全长应不小于（）。",
    opts: ["A.300m", "B.600m", "C.900m", "D.1200m"]
  },
  {
    q: "7.跑道边灯的发光颜色应为（）。",
    opts: ["A.白色", "B.绿色", "C.红色", "D.黄色"]

  {

  },

    q: "10.跑道入口灯的颜色应为（）。",

/* SECTION: state */
var currentQ = 0;
var selectedAnswers = {};
var timerSeconds = 100 * 60;
var timerInterval = null;

/* SECTION: navigation */
function showScreen(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) {
    screens[i].classList.remove('active');
  }
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

/* SECTION: screen1-logic */
document.getElementById('btnDailyExam').addEventListener('click', function() {
  showScreen('screen2');
});

document.querySelectorAll('.s1-tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.s1-tab').forEach(function(t) { t.classList.remove('active'); });
    tab.classList.add('active');
  });
});

document.getElementById('btnBackToS1').addEventListener('click', function() {
  showScreen('screen1');
});

/* SECTION: screen2-logic */
document.getElementById('btnStartExam').addEventListener('click', function() {
  showScreen('screen3');
  currentQ = 0;
  selectedAnswers = {};
  timerSeconds = 100 * 60;
  renderQuestion();
  startTimer();
});

document.getElementById('btnBackToS2').addEventListener('click', function() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  showScreen('screen2');
});

/* SECTION: quiz-logic */
function renderQuestion() {
  var data = questions[currentQ];
  var qText = document.getElementById('questionText');
  qText.textContent = data.q;

  var container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  for (var i = 0; i < data.opts.length; i++) {
    var btn = document.createElement('button');
    btn.className = 's3-option';
    btn.textContent = data.opts[i];
    btn.setAttribute('data-index', i);
    if (selectedAnswers[currentQ] === i) {
      btn.classList.add('selected');
    }
    btn.addEventListener('click', (function(idx, el) {
      return function() {
        selectedAnswers[currentQ] = idx;
        var all = container.querySelectorAll('.s3-option');
        for (var j = 0; j < all.length; j++) { all[j].classList.remove('selected'); }
        el.classList.add('selected');
      };
    })(i, btn));
    container.appendChild(btn);
  }

  var prevBtn = document.getElementById('btnPrev');
  var nextBtn = document.getElementById('btnNext');
  if (currentQ === 0) {
    prevBtn.classList.add('s3-btn-hidden');
  } else {
    prevBtn.classList.remove('s3-btn-hidden');
  }
  if (currentQ === questions.length - 1) {
    nextBtn.textContent = '交卷';
  } else {
    nextBtn.textContent = '下一题';
  }
}

document.getElementById('btnPrev').addEventListener('click', function() {
  if (currentQ > 0) { currentQ--; renderQuestion(); }
});
document.getElementById('btnNext').addEventListener('click', function() {
  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    var answered = Object.keys(selectedAnswers).length;
    alert('交卷成功！\n已答题：' + answered + '/' + questions.length + ' 道');
    showScreen('screen1');
  }
});

/* SECTION: timer */
function startTimer() {
  if (timerInterval) { clearInterval(timerInterval); }
  updateTimerDisplay();
  timerInterval = setInterval(function() {
    timerSeconds--;
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      alert('考试时间到！');
      showScreen('screen1');
      return;
    }
    updateTimerDisplay();
  }, 1000);
}
function updateTimerDisplay() {
  var h = Math.floor(timerSeconds / 3600);
  var m = Math.floor((timerSeconds % 3600) / 60);
  var s = timerSeconds % 60;
  var str = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  document.getElementById('timerDisplay').textContent = str;
}
</script>
